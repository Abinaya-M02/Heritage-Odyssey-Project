<!DOCTYPE html>
<html>

<head>

    <title>Sign Up</title>

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        video{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

        .box{
    width:380px;
    margin:100px auto;
    padding:30px;

    background:rgba(255,255,255,0.85);

    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);

    text-align:center;
}

        h1{
            color:#4B2E20;
            align-self: center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .input-box{
    position:relative;
    margin:15px 0;
}

.input-box input{
    width:100%;
    padding:12px 45px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
    box-sizing:border-box;
}

.input-box .fa-envelope,
.input-box .fa-lock{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:gray;
}

.toggle-password{
    position:absolute;
    right:18px;
    left:auto;
    top:50%;
    transform:translateY(-50%);
    color:gray;
    cursor:pointer;
    font-size:18px;
}

.input-box > i:first-child{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:gray;
    font-size:18px;
}

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            background:#8B5E3C;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#6d472d;
        }

        p{
            margin-top:20px;
        }

        a{
            text-decoration:none;
            color:#8B5E3C;
            font-weight:bold;
        }

    </style>

</head>

<body>

<video autoplay muted loop>
    <source src="{{ url_for('static', filename='heritage.mp4') }}" type="video/mp4">
</video>

<div class="box">

    <h1>🙏</h1>

    <form method="POST">

        <div class="input-box">
    <i class="fa-solid fa-user"></i>

    <input
        type="text"
        name="name"
        placeholder="Enter Your Name"
        required>
</div>


    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter Password"
               required>

        <i class="fa-solid fa-eye toggle-password"
           onclick="showPassword()"></i>
    </div>
    
    
    <button type="submit">Sign Up</button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

<script>
function showPassword(){

    var x = document.getElementById("password");

    if(x.type === "password"){
        x.type = "text";
    }else{
        x.type = "password";
    }
}
</script>

</body>

</html>
